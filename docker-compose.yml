services:
  backend:
    build: ./backend
    container_name: homerun-iq-backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/live
    container_name: homerun-iq-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
