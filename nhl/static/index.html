<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GoalIQ — NHL goalscorer, points and shots model</title>
<meta name="description" content="Model probabilities for every NHL skater, every night: anytime goals, points and shots on goal, with a public, graded track record.">
<meta name="theme-color" content="#070b14">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b14; --bg2:#0a101c; --card:#0d1422; --card2:#111a2b; --line:#1b2536; --line2:#253147;
  --ink:#e8eef6; --muted:#8b98ab; --dim:#5f6c80;
  --ice:#4cc3f5; --ice-soft:rgba(76,195,245,.14); --ice-ink:#062030;
  --hit:#2fd17a; --hit-soft:rgba(47,209,122,.13); --miss:#f2555a; --miss-soft:rgba(242,85,90,.12); --warn:#f0b54a;
  --head:"Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --body:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  background-image:radial-gradient(1200px 400px at 50% -200px, rgba(76,195,245,.07), transparent);
  min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0)}
a{color:var(--ice);text-decoration:none} a:hover{text-decoration:underline}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
header.top{border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;background:rgba(7,11,20,.88);backdrop-filter:blur(10px)}
header.top .wrap{display:flex;align-items:center;gap:28px;height:62px}
.logo{font:700 21px/1 var(--head);letter-spacing:-.3px;color:var(--ink);display:flex;align-items:baseline;gap:12px}
.logo b{color:var(--ice)} .logo small{font:500 11px/1 var(--body);letter-spacing:1.6px;color:var(--dim)}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main a{color:var(--muted);padding:8px 12px;border-radius:8px;font-weight:500;position:relative}
nav.main a:hover{color:var(--ink);text-decoration:none;background:var(--card)}
nav.main a[aria-current="page"]{color:var(--ink)}
nav.main a[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-12px;height:2px;background:var(--ice);border-radius:2px}
.acct{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;padding:8px 14px;font-weight:600;border:1px solid var(--line2);background:var(--card);color:var(--ink);white-space:nowrap}
.btn:hover{text-decoration:none;border-color:var(--dim)}
.btn.pri{background:var(--ice);border-color:var(--ice);color:var(--ice-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 11px;font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);display:grid;place-items:center;font-weight:700;font-size:13px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.badge-pro{font:700 10px/1 var(--body);letter-spacing:.8px;padding:4px 6px;border-radius:5px;background:var(--ice-soft);color:var(--ice)}

/* date bar */
.datebar{display:flex;align-items:center;gap:10px;padding:16px 0 18px;border-bottom:1px solid var(--line)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{color:var(--ink);border-color:var(--dim)}
.datebar input{background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:6px 10px;height:36px}
.datebar .lbl{font:600 15px var(--head)}
.datebar .rel{margin-left:auto;font-size:11px;letter-spacing:1.6px;color:var(--dim);text-transform:uppercase}
main{padding:22px 0 40px;min-height:60vh}
h1.page{font:600 26px/1.15 var(--head);margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--muted);margin:0 0 18px}

/* games strip */
.games{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 18px;scroll-snap-type:x proximity}
.game{flex:0 0 226px;scroll-snap-align:start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.game:hover{border-color:var(--line2)}
.game[aria-pressed="true"]{border-color:var(--ice);box-shadow:0 0 0 1px var(--ice) inset}
.game .mu{display:flex;justify-content:space-between;align-items:baseline;font:700 15px var(--head)}
.game .mu span{color:var(--dim);font-weight:500;margin:0 3px}
.game .when{font:500 13px var(--body);color:var(--muted)}
.game .when.live{color:var(--hit)} .game .when.final{color:var(--dim)}
.game .gl{display:grid;grid-template-columns:38px 1fr auto;gap:2px 6px;margin-top:8px;font-size:13px}
.game .gl i{font-style:normal;color:var(--dim);font:600 11px var(--head);letter-spacing:.5px;align-self:center}
.game .gl em{font-style:normal;font-size:10px;letter-spacing:.8px;color:var(--dim);text-transform:uppercase;align-self:center}
.game .gl em.ok{color:var(--hit)}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{flex:1 1 240px;position:relative}
.search input{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:9px 12px 9px 36px;height:40px}
.search svg{position:absolute;left:12px;top:12px;color:var(--dim)}
select.sel{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:0 10px;height:40px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:6px 12px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ice-soft);color:var(--ice)}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:0 13px;height:40px;color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--ice);color:var(--ice);background:var(--ice-soft)}
.markets{margin-bottom:14px}
.count{font-size:11px;letter-spacing:1.6px;color:var(--dim);text-transform:uppercase;margin:4px 0 8px}
.note{font-size:13px;color:var(--muted)}

/* table */
table.board{width:100%;border-collapse:collapse}
table.board th{font:600 10.5px/1.25 var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.board th:first-child{text-align:left}
table.board th[aria-sort]{color:var(--ice)}
table.board th[aria-sort="descending"]::after{content:" ↓"} table.board th[aria-sort="ascending"]::after{content:" ↑"}
table.board td{padding:12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
table.board td:first-child{text-align:left}
table.board tr.hit td{background:var(--hit-soft)}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.hs{width:40px;height:40px;border-radius:50%;background:var(--card2);border:1px solid var(--line);flex:0 0 40px;overflow:hidden}
.hs img{width:100%;height:100%;object-fit:cover}
.nm{font-weight:600;font-size:15px}
.meta{color:var(--muted);font-size:13px}
.tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.tag{font:600 10.5px/1 var(--body);letter-spacing:.6px;padding:4px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--muted);text-transform:uppercase}
.tag.pp1{color:var(--ice);border-color:rgba(76,195,245,.35);background:var(--ice-soft)}
.tag.warn{color:var(--warn);border-color:rgba(240,181,74,.35)}
.tag.goal{color:var(--hit);border-color:rgba(47,209,122,.4);background:var(--hit-soft)}
.prob{min-width:150px}
.prob b{font:700 18px var(--head);display:block}
.bar{height:4px;border-radius:3px;background:var(--line2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ice);border-radius:3px}
.tip{border-bottom:1px dotted var(--dim);cursor:help}

/* cards (mobile + lists) */
.cards{display:none}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.pcard.hit{border-color:rgba(47,209,122,.45);background:linear-gradient(var(--hit-soft),var(--hit-soft)),var(--card)}
.pcard .row{display:flex;gap:12px;align-items:center}
.pcard .right{margin-left:auto;text-align:right}
.pcard .right b{font:700 18px var(--head)}
.pcard details summary{list-style:none;cursor:pointer}
.pcard details summary::-webkit-details-marker{display:none}
.pcard dl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0;font-size:13px}
.pcard dt{color:var(--dim);font-size:11px} .pcard dd{margin:0;font-weight:600}

/* paywall */
.lockcard{margin:14px 0;border:1px solid rgba(76,195,245,.35);border-radius:16px;padding:22px;background:
  linear-gradient(135deg, rgba(76,195,245,.10), rgba(76,195,245,.02) 60%), var(--card);display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.lockcard h3{font:600 20px/1.2 var(--head);margin:0 0 6px}
.lockcard p{margin:0;color:var(--muted)}
.lockcard ul{margin:10px 0 0;padding:0;list-style:none;color:var(--ink);font-size:14px;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.lockcard li::before{content:"✓  ";color:var(--ice);font-weight:700}
.lockcard .cta{text-align:center}
.lockcard .cta small{display:block;color:var(--dim);margin-top:6px;font-size:12px}
.ghost-rows{position:relative;margin-top:-6px}
.ghost{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 12px;opacity:.45}
.ghost span{height:10px;border-radius:5px;background:var(--line2)}

/* best bets / parlays */
.list{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.li{display:grid;grid-template-columns:34px 44px 1fr auto auto 92px;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.rank{font:700 15px var(--head);color:var(--dim);text-align:center}
.li .pp{text-align:right} .li .pp b{font:700 17px var(--head);display:block} .li .pp small{color:var(--muted)}
.res{font:600 11px/1 var(--body);letter-spacing:.6px;text-transform:uppercase;padding:6px 8px;border-radius:6px;text-align:center;background:var(--card2);color:var(--muted)}
.res.Hit,.res.Won{background:var(--hit-soft);color:var(--hit)} .res.Miss,.res.Lost{background:var(--miss-soft);color:var(--miss)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.parlay{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.parlay h3{font:600 16px var(--head);margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.leg{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.leg:last-of-type{border-bottom:0}
.leg .hs{width:32px;height:32px;flex-basis:32px}
.leg .ic{margin-left:auto;font-weight:700}
.parlay .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.parlay .foot b{font:700 20px var(--head)}

/* record */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi h3{font:600 15px var(--head);margin:0 0 10px;display:flex;justify-content:space-between}
.kpi .big{font:700 30px/1 var(--head)} .kpi .big small{font-size:14px;color:var(--muted);font-weight:500}
.tiers{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.tiers td,.tiers th{padding:6px 0;border-top:1px solid var(--line);text-align:right}
.tiers th{color:var(--dim);font-weight:500;font-size:11px;letter-spacing:.6px;text-transform:uppercase}
.tiers td:first-child,.tiers th:first-child{text-align:left}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
.panel h2{font:600 18px var(--head);margin:0 0 4px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
table.simple{width:100%;border-collapse:collapse;font-size:14px}
table.simple th,table.simple td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right}
table.simple th{color:var(--dim);font-weight:500;font-size:11px;letter-spacing:.8px;text-transform:uppercase}
table.simple td:first-child,table.simple th:first-child{text-align:left}

/* prose */
.prose{max-width:72ch} .prose h2{font:600 20px var(--head);margin:28px 0 8px} .prose p,.prose li{color:#c9d3df}
.price-card{max-width:440px;background:var(--card);border:1px solid rgba(76,195,245,.4);border-radius:18px;padding:24px;margin-top:10px}
.price-card .p{font:700 40px/1 var(--head)} .price-card .p small{font-size:16px;color:var(--muted);font-weight:500}
.price-card ul{padding:0;list-style:none;margin:16px 0 20px} .price-card li{padding:6px 0;border-bottom:1px solid var(--line)}
.price-card li::before{content:"✓  ";color:var(--ice);font-weight:700}

/* states */
.empty,.err{text-align:center;padding:56px 16px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:16px}
.empty h3,.err h3{color:var(--ink);font:600 18px var(--head);margin:0 0 6px}
.skel{height:58px;border-radius:12px;margin-bottom:8px;background:linear-gradient(90deg,var(--card) 0,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);padding:10px 16px;border-radius:10px;z-index:50;font-size:14px}
.banner{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px;color:var(--muted)}

footer{border-top:1px solid var(--line);padding:24px 0 100px;color:var(--dim);font-size:12.5px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
footer a{color:var(--muted)}

/* bottom nav (mobile) */
nav.bottom{display:none}
@media (max-width:860px){
  .wrap{padding:0 16px}
  nav.main,.logo small{display:none}
  .acct{margin-left:auto}
  nav.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,16,28,.96);
    backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0))}
  nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dim);padding:4px 0}
  nav.bottom a[aria-current="page"]{color:var(--ice)}
  nav.bottom a:hover{text-decoration:none}
  table.board{display:none} .cards{display:block}
  .li{grid-template-columns:26px 36px 1fr auto;row-gap:6px} .li .hide-m{display:none}
  .li .res{grid-column:3 / 5;justify-self:start}
  .kpis{grid-template-columns:1fr}
  .lockcard{grid-template-columns:1fr} .lockcard ul{grid-template-columns:1fr}
  .datebar .rel{display:none}
  .pgrid{grid-template-columns:1fr}
  .game{flex-basis:210px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="/" data-link><span>Goal<b>IQ</b></span><small>NHL PROPS MODEL</small></a>
  <nav class="main" aria-label="Main">
    <a href="/" data-link>Tonight</a><a href="/best-bets" data-link>Best Bets</a><a href="/parlays" data-link>Parlays</a>
    <a href="/track-record" data-link>Track Record</a><a href="/how-it-works" data-link>How it works</a>
  </nav>
  <div class="acct" id="acct"></div>
</div></header>

<div class="wrap">
  <div class="datebar" id="datebar">
    <button class="iconbtn" data-shift="-1" aria-label="Previous day"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
    <input type="date" id="date" aria-label="Slate date">
    <button class="iconbtn" data-shift="1" aria-label="Next day"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
    <span class="lbl" id="datelbl"></span><span class="rel" id="daterel"></span>
  </div>
  <main id="view" tabindex="-1"></main>
</div>

<footer><div class="wrap">
  <span>For entertainment only. Not betting advice. 21+. Gambling problem? Call 1-800-GAMBLER.</span>
  <span><a href="/pricing" data-link>Pricing</a> · <a href="/terms" data-link>Terms &amp; responsible play</a></span>
</div></footer>

<nav class="bottom" aria-label="Main">
  <a href="/" data-link><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg>Tonight</a>
  <a href="/best-bets" data-link><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Best Bets</a>
  <a href="/parlays" data-link><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Parlays</a>
  <a href="/track-record" data-link><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Record</a>
  <a href="/how-it-works" data-link><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 1-1 1.7M12 17h.01"/></svg>How</a>
</nav>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x, d = 1) => x == null ? "–" : (x * 100).toFixed(d) + "%";
const odds = o => o == null ? "–" : (typeof o === "string" ? o : (o > 0 ? "+" + o : String(o)));
const etToday = () => new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
const PREGAME = ["FUT", "PRE"], FINAL = ["FINAL", "OFF"];
const MK = { goal: { key: "p_goal", fair: "fair_goal", label: "Anytime goal", stat: 0, need: 1 },
             point: { key: "p_point", fair: "fair_point", label: "1+ point", stat: 1, need: 1 },
             sog: { key: "p_sog3", fair: "fair_sog3", label: "3+ shots on goal", stat: 2, need: 3 } };
const ST = { me: null, date: etToday(), market: "goal", game: null, sort: null, dir: -1, filters: { team: "", pos: "", pp1: false, gtd: false, q: "" },
             board: null, live: {}, liveTimer: null, bbMarket: "Goal" };

async function api(path) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 60000);
  try {
    const r = await fetch(path, { credentials: "same-origin", signal: ctl.signal });
    if (!r.ok) { let m = ""; try { m = (await r.json()).detail } catch (e) {} throw new Error(m || "Server returned " + r.status); }
    return await r.json();
  } finally { clearTimeout(t); }
}
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function headshot(url, alt = "") { return `<span class="hs">${url ? `<img src="${esc(url)}" alt="${esc(alt)}" loading="lazy" onerror="this.remove()">` : ""}</span>`; }
const hsUrl = (team, id) => `https://assets.nhle.com/mugs/nhl/20262027/${team}/${id}.png`;
const skel = (n = 6) => Array.from({ length: n }, () => `<div class="skel"></div>`).join("");
function errBox(msg, retry) { return `<div class="err"><h3>Couldn't load this</h3><p>${esc(msg)}</p><button class="btn" onclick="${retry}">Retry</button></div>`; }
function localTime(iso) { return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
function niceDate(d) { return new Date(d + "T12:00:00").toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }); }

}

/* ---------------- routing ---------------- */
const ROUTES = { "/": tonight, "/best-bets": bestBets, "/parlays": parlays, "/track-record": record, "/how-it-works": how, "/pricing": pricing, "/terms": terms };
function go(path, push = true) {
  if (push) history.pushState({}, "", path);
  const p = location.pathname in ROUTES ? location.pathname : "/";
  document.querySelectorAll("nav a[data-link]").forEach(a => a.getAttribute("href") === p ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  $("#datebar").style.display = ["/", "/best-bets", "/parlays"].includes(p) ? "" : "none";
  clearTimeout(ST.liveTimer);
  ROUTES[p]();
  window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-link]");
  if (a && !e.metaKey && !e.ctrlKey && a.origin === location.origin) { e.preventDefault(); go(a.pathname); }
});
window.addEventListener("popstate", () => go(location.pathname, false));
function setDate(d) {
  ST.date = d; $("#date").value = d; $("#datelbl").textContent = niceDate(d);
  const t = etToday(); $("#daterel").textContent = d === t ? "Tonight" : d < t ? "Past slate" : "Upcoming";
}
$("#date").onchange = e => { if (e.target.value) { setDate(e.target.value); go(location.pathname, false); } };
document.querySelectorAll("#datebar [data-shift]").forEach(b => b.onclick = () => {
  const d = new Date(ST.date + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + +b.dataset.shift);
  setDate(d.toISOString().slice(0, 10)); go(location.pathname, false);
});

async function tonight() {

  try { b = await api(`/api/board?date=${ST.date}&market=${ST.market}`); }
  catch (e) { v.innerHTML = errBox(e.name === "AbortError" ? "The model is waking up. Give it a few seconds." : e.message, "go(location.pathname,false)"); return; }
  ST.board = b;
  if (!b.games.length) { v.innerHTML = `<div class="empty"><h3>No NHL games on this date</h3><p>Pick another day with the arrows above.</p></div>`; return; }
  const teams = [...new Set(b.games.flatMap(g => [g.away, g.home]))].sort();
  v.innerHTML = `
    <div class="games" id="games">${b.games.map(gameCard).join("")}</div>
    ${b.source === "early" ? `<div class="banner">Early look from the original GoalIQ goal model. Tonight's full model run, with points and shots, lands mid-afternoon Eastern once goalies are confirmed.</div>` : ""}
    <div class="seg markets" role="group" aria-label="Market">${Object.entries(MK).map(([k, m]) => `<button data-mk="${k}" aria-pressed="${ST.market === k}">${m.label}</button>`).join("")}</div>
    <div class="controls">
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search players" value="${esc(ST.filters.q)}" aria-label="Search players"></label>
      <select class="sel" id="fteam" aria-label="Team"><option value="">All teams</option>${teams.map(t => `<option ${ST.filters.team === t ? "selected" : ""}>${t}</option>`).join("")}</select>
      <div class="seg" role="group" aria-label="Position">${[["", "All"], ["F", "Forwards"], ["D", "Defense"]].map(([k, l]) => `<button data-pos="${k}" aria-pressed="${ST.filters.pos === k}">${l}</button>`).join("")}</div>
      <button class="chip" id="fpp" aria-pressed="${ST.filters.pp1}">PP1 only</button>
      <button class="chip" id="fgtd" aria-pressed="${ST.filters.gtd}">Hide game-time decisions</button>
    </div>
    <div id="tbl"></div>`;
  $("#games").onclick = e => { const c = e.target.closest(".game"); if (!c) return; ST.game = ST.game === +c.dataset.gid ? null : +c.dataset.gid; document.querySelectorAll(".game").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.gid === ST.game))); renderBoard(); };
  v.querySelectorAll("[data-mk]").forEach(x => x.onclick = () => { ST.market = x.dataset.mk; ST.sort = null; tonight(); });
  v.querySelectorAll("[data-pos]").forEach(x => x.onclick = () => { ST.filters.pos = x.dataset.pos; v.querySelectorAll("[data-pos]").forEach(y => y.setAttribute("aria-pressed", String(y === x))); renderBoard(); });
  $("#q").oninput = e => { ST.filters.q = e.target.value; renderBoard(); };
  $("#fteam").onchange = e => { ST.filters.team = e.target.value; renderBoard(); };
  $("#fpp").onclick = e => { ST.filters.pp1 = !ST.filters.pp1; e.target.setAttribute("aria-pressed", ST.filters.pp1); renderBoard(); };
  $("#fgtd").onclick = e => { ST.filters.gtd = !ST.filters.gtd; e.target.setAttribute("aria-pressed", ST.filters.gtd); renderBoard(); };
  renderBoard(); pollLive();

function gameCard(g) {
  const live = !PREGAME.includes(g.state), fin = FINAL.includes(g.state);
  const gl = t => { const x = g.goalies[t] || {}; const ok = (x.status || "").toLowerCase() === "confirmed";
    return `<i>${t}</i><span>${esc(x.name || "TBD")}</span><em class="${ok ? "ok" : ""}">${x.name ? esc(x.status || "Unconfirmed") : ""}</em>`; };
  return `<button class="game" data-gid="${g.game_id}" aria-pressed="${ST.game === g.game_id}">
    <div class="mu"><div>${g.away}<span>at</span>${g.home}</div><div class="when ${fin ? "final" : live ? "live" : ""}">${fin ? "Final" : live ? "Live" : localTime(g.start_utc)}</div></div>
    <div class="gl">${gl(g.away)}${gl(g.home)}</div></button>`;
}
function liveHit(p) {
  const s = ST.live[p.player_id]; if (!s) return false; const m = MK[ST.market]; return s[m.stat] >= m.need;
}
function renderBoard() {
  const b = ST.board, m = MK[ST.market], f = ST.filters;
  let ps = b.players.slice();
  if (ST.game) ps = ps.filter(p => p.game_id === ST.game);
  if (f.team) ps = ps.filter(p => p.team === f.team);
  if (f.pos) ps = ps.filter(p => (p.pos === "D" ? "D" : "F") === f.pos);
  if (f.pp1) ps = ps.filter(p => p.pp_unit === "pp1");
  if (f.gtd) ps = ps.filter(p => !p.gtd);
  if (f.q) { const q = f.q.toLowerCase(); ps = ps.filter(p => p.name.toLowerCase().includes(q)); }
  const sk = ST.sort || m.key;
  ps.sort((a, c) => { const x = a[sk], y = c[sk]; if (typeof x === "string") return ST.dir * x.localeCompare(y); return ST.dir * ((x ?? -1e9) - (y ?? -1e9)); });
  const max = Math.max(.01, ...b.players.map(p => p[m.key] || 0));
  const cols = ST.market === "goal" ? [["sog_proj", "Exp. shots", 1], ["xg60", "xG / 60", 2], ["pp_toi", "PP min", 1], ["finishing", "Finishing", 2]]
             : ST.market === "point" ? [["toi", "TOI", 1], ["pp_toi", "PP min", 1], ["sog_proj", "Exp. shots", 1]]
             : [["sog_proj", "Exp. shots", 2], ["p_sog2", "2+ SOG", "%"], ["p_sog4", "4+ SOG", "%"], ["toi", "TOI", 1]];
  const fmt = (v, d) => v == null ? "–" : d === "%" ? pct(v, 0) : Number(v).toFixed(d);
  const tags = p => `<div class="tags">${liveHit(p) ? `<span class="tag goal">${ST.market === "goal" ? "🚨 Goal" : "Hit"}</span>` : ""}${p.pp_unit ? `<span class="tag ${p.pp_unit}">${p.pp_unit}</span>` : ""}${p.line ? `<span class="tag">${p.line[0] === "d" ? "Pair " : "Line "}${p.line[1]}</span>` : ""}${p.gtd ? `<span class="tag warn">Game-time call</span>` : ""}</div>`;
  const sub = p => `${p.team} ${p.home ? "vs" : "at"} ${p.opp} · facing ${esc(p.opp_goalie || "TBD")}`;
  const locked = b.locked || 0;
  const th = (k, l, cls = "") => `<th data-k="${k}" ${sk === k ? `aria-sort="${ST.dir < 0 ? "descending" : "ascending"}"` : ""} class="${cls}">${l}</th>`;
  let html = `<div class="count">${b.players.length + locked} skaters${b.lineups_note ? ` · ${esc(b.lineups_note)}` : ""}</div>`;
  if (!ps.length && !locked) html += `<div class="empty"><h3>No skaters match</h3><p>Clear a filter to see more.</p></div>`;
  else {
    html += `<table class="board"><thead><tr>${th("name", "Player")}${th(m.key, m.label + " chance")}${th(m.fair, "Fair odds")}${cols.map(c => th(c[0], c[1])).join("")}</tr></thead><tbody>
      ${ps.map(p => `<tr class="${liveHit(p) ? "hit" : ""}"><td><div class="who">${headshot(p.headshot)}<div><div class="nm">${esc(p.name)}</div><div class="meta">${sub(p)}</div>${tags(p)}</div></div></td>
        <td class="prob num"><b>${pct(p[m.key])}</b><div class="bar"><i style="width:${(100 * (p[m.key] || 0) / max).toFixed(1)}%"></i></div></td>
        <td class="num">${odds(p[m.fair])}</td>${cols.map(c => `<td class="num">${fmt(p[c[0]], c[2])}</td>`).join("")}</tr>`).join("")}</tbody></table>
      <div class="cards">${ps.map(p => `<div class="pcard ${liveHit(p) ? "hit" : ""}"><details><summary><div class="row">${headshot(p.headshot)}<div style="min-width:0"><div class="nm">${esc(p.name)}</div><div class="meta">${sub(p)}</div></div>
        <div class="right num"><b>${pct(p[m.key])}</b><div class="meta">${odds(p[m.fair])}</div></div></div><div class="bar"><i style="width:${(100 * (p[m.key] || 0) / max).toFixed(1)}%"></i></div>${tags(p)}</summary>
        <dl>${cols.map(c => `<div><dt>${c[1]}</dt><dd class="num">${fmt(p[c[0]], c[2])}</dd></div>`).join("")}</dl></details></div>`).join("")}</div>`;
  }
  if (locked) html += `<div class="ghost-rows" aria-hidden="true">${Array.from({ length: 3 }, () => `<div class="ghost"><span style="width:40px;height:40px;border-radius:50%"></span><span style="width:160px"></span><span style="width:60px;margin-left:auto"></span></div>`).join("")}</div>`
    + lockCard(locked, ST.market === "goal" ? "See every skater on tonight's board" : `The ${m.label} board is part of Pro`);
  $("#tbl").innerHTML = html;
  $("#tbl").querySelectorAll("th[data-k]").forEach(t => t.onclick = () => { const k = t.dataset.k; ST.dir = ST.sort === k ? -ST.dir : (k === "name" ? 1 : -1); ST.sort = k; renderBoard(); });
}
async function pollLive() {
  clearTimeout(ST.liveTimer);
  const b = ST.board; if (!b || !b.games.some(g => !PREGAME.includes(g.state))) return;
  try {
    const d = await api(`/api/live?date=${b.date}`); ST.live = {};
    d.games.forEach(g => Object.assign(ST.live, g.stats));
    if (location.pathname === "/") renderBoard();
  } catch (e) {}
  if (b.games.some(g => !PREGAME.includes(g.state) && !FINAL.includes(g.state))) ST.liveTimer = setTimeout(pollLive, 60000);
}

/* ---------------- Track record ---------------- */
async function record() {
  const v = $("#view");
  v.innerHTML = `<h1 class="page">Track record</h1><p class="sub">Every published pick, graded against the final box score. Nothing deleted, nothing hidden.</p>${skel(5)}`;
  let d; try { d = await api("/api/record"); } catch (e) { v.innerHTML += errBox(e.message, "go(location.pathname,false)"); return; }
  const labels = { "Goal": "Anytime goal", "1+ point": "1+ point", "3+ SOG": "3+ shots on goal" };
  const graded = d.markets.reduce((s, m) => s + m.graded, 0);
  const kpi = m => `<div class="kpi"><h3>${labels[m.market]}<span class="meta">${m.graded} graded</span></h3>
    ${m.graded ? `<div class="big num">${pct(m.hits / m.graded)} <small>hit rate · ${m.hits} of ${m.graded}</small></div><div class="meta" style="margin-top:6px">Model expected ${m.expected} hits</div>
    <table class="tiers"><tr><th>Picks</th><th>Hits</th><th>Expected</th><th>Rate</th></tr>${m.tiers.map(t => `<tr><td>${t.label}</td><td class="num">${t.hits}/${t.n}</td><td class="num">${t.expected}</td><td class="num">${pct(t.hits / t.n, 0)}</td></tr>`).join("")}</table>`
    : `<div class="meta">Grading starts once the first picks' games go final.</div>`}</div>`;
  const g = d.markets[0];
  const chart = series => {
    if (!series.length) return "";
    const W = 900, H = 200, pad = 26, n = series.length, bw = Math.max(4, Math.min(26, (W - pad * 2) / n - 4));
    const maxv = Math.max(1, ...series.map(s => Math.max(s.hits, s.expected)));
    const x = i => pad + (i + .5) * (W - pad * 2) / n, y = v => H - pad - (v / maxv) * (H - pad * 2);
    const bars = series.map((s, i) => `<rect x="${x(i) - bw / 2}" y="${y(s.hits)}" width="${bw}" height="${H - pad - y(s.hits)}" rx="2" fill="var(--ice)" opacity=".85"><title>${s.date}: ${s.hits} of ${s.n} hit (expected ${s.expected})</title></rect>`).join("");
    const line = series.map((s, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(s.expected).toFixed(1)}`).join("");
    const ticks = series.map((s, i) => (n <= 14 || i % Math.ceil(n / 10) === 0) ? `<text x="${x(i)}" y="${H - 6}" fill="var(--dim)" font-size="11" text-anchor="middle">${s.date.slice(5).replace("-", "/")}</text>` : "").join("");
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily goal-pick hits versus model expectation"><line x1="${pad}" x2="${W - pad}" y1="${H - pad}" y2="${H - pad}" stroke="var(--line2)"/>${bars}<path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="4 4"/>${ticks}</svg>
      <div class="legend"><span><i style="background:var(--ice)"></i>Goal picks that scored</span><span><i style="background:var(--ink)"></i>Model expectation</span></div>`;
  };
  v.innerHTML = `<h1 class="page">Track record</h1><p class="sub">Every published pick since ${d.since ? niceDate(d.since) : "launch"}, graded against the final box score. Nothing deleted, nothing hidden. Today's picks show here the morning after their games.</p>
    <div class="kpis">${d.markets.map(kpi).join("")}</div>
    ${g.days.length ? `<div class="panel chart"><h2>Goal picks by night</h2><p class="note">Bars are how many of the night's top 10 scored; the dashed line is how many the model expected.</p>${chart(g.days)}</div>` : ""}
    <div class="panel"><h2>Parlays</h2>${d.parlays.length ? `<table class="simple"><tr><th>Type</th><th>Graded</th><th>Won</th><th>Expected wins</th></tr>${d.parlays.map(p => `<tr><td>${esc(p.type)}</td><td class="num">${p.graded}</td><td class="num">${p.won}</td><td class="num">${p.expected}</td></tr>`).join("")}</table>` : `<p class="note">No parlays graded yet.</p>`}</div>
    <div class="panel"><h2>How the model did on last season</h2><p class="note">Trained only on 2024-25, then tested on every 2025-26 game it had never seen. Predicted and actual hit rates should match, and they do.</p>
      <table class="simple"><tr><th>Picks</th><th>Market</th><th>Predicted</th><th>Actual</th><th>Picks tested</th></tr>${d.backtest.top.map(t => `<tr><td>${esc(t.picks)}</td><td>${esc(t.market)}</td><td class="num">${t.predicted_pct}%</td><td class="num">${t.actual_pct}%</td><td class="num">${t.picks_n.toLocaleString()}</td></tr>`).join("")}</table></div>
    <p class="note">Current models: goals ${esc(d.champions.goal || "–")}, points ${esc(d.champions.point || "–")}, shots ${esc(d.champions.sog || "–")}. ${graded ? "" : "The live record starts with the first graded slate."}</p>`;
}

/* ---------------- static pages ---------------- */
function how() {
  $("#view").innerHTML = `<div class="prose"><h1 class="page">How it works</h1>
  <h2>What the numbers mean</h2><p>Each percentage is the model's chance that the player does it tonight: scores at least one goal (overtime counts), records at least one point, or puts at least three shots on goal. Fair odds turn that chance into the break-even American price. When a sportsbook offers a longer price than the fair odds, the model thinks the bet is worth more than it costs.</p>
  <h2>What goes into it</h2><p>Every skater's shot quality (expected goals per 60 minutes, from MoneyPuck), shot volume and high-danger share, finishing skill pulled toward average so a hot week doesn't fool it, ice time and power-play time weighted toward recent games, his line's chance creation, the opposing starting goalie, how many chances the opponent gives up, home ice, and back-to-backs.</p>
  <h2>Lineups and goalies</h2><p>Projected lines, power-play units and starting goalies come from DailyFaceoff. Players who aren't in tonight's projected lineup are removed, so the model never picks someone who isn't dressing. Picks post mid-afternoon Eastern, after most goalies are confirmed. Games that have already started are left out of that day's picks.</p>
  <h2>It tests itself every day</h2><p>Each morning the model tries new ideas against the current version on games it has never seen. An idea is adopted only if it wins on two separate test periods. Every test, win or lose, is logged.</p>
  <h2>Why you can trust the percentages</h2><p>Trained on 2024-25 and tested on all of 2025-26, the model's top goal pick each night scored about 42% of the time, matching what it predicted. Across every probability level, predicted and actual hit rates line up within a few points. The live record is on the Track Record page, graded nightly.</p>
  <h2>Parlays</h2><p>Model parlays take one player per game so the legs are independent, and the parlay's chance is the product of its legs. Parlays compound uncertainty: a two-leg goal parlay hits about one night in five.</p></div>`;
}

  $("#view").innerHTML = `<div class="prose"><h1 class="page">GoalIQ Pro</h1><p class="sub">Everything the model sees, every night of the NHL season.</p></div>
  <div class="price-card"><div class="p">$14.99<small> / month</small></div>
    <ul><li>Full boards for anytime goals, points and shots on goal</li><li>All 30 Best Bets each night, graded</li><li>Model parlays with fair odds</li><li>Live goal alerts on the board</li><li>Cancel anytime from your Whop account</li></ul>
    ${cta}
    ${!me.logged_in && me.signin_ready ? `<p class="note" style="margin-top:12px">Already subscribed? <a href="/auth/login?next=/">Sign in with Whop</a>.</p>` : ""}
    <p class="note" style="margin-top:12px">Free without an account: tonight's top 3 goal picks, every past slate in full, and the complete track record.</p></div>`;
}

  <p>GoalIQ publishes statistical estimates for entertainment and research. It is not betting, financial or legal advice, and it does not take or place wagers. You must be 21 or older, and of legal betting age where you live, to use GoalIQ for wagering decisions.</p>
  <h2>No guarantees</h2><p>Probabilities are estimates. Players get scratched, lines change and goalies are swapped late. Past results, including the published track record, don't guarantee future results. Never bet more than you can afford to lose.</p>
  <h2>Subscriptions</h2><p>GoalIQ Pro is billed monthly through Whop and renews until you cancel. You can cancel anytime from your Whop account; access continues to the end of the paid period. Refunds follow Whop's policy unless required by law.</p>
  <h2>Data</h2><p>Statistics come from public NHL.com data, MoneyPuck and DailyFaceoff. GoalIQ isn't affiliated with or endorsed by the NHL or any team. Player headshots are property of the NHL.</p>
  <h2>Gambling problem?</h2><p>Call or text 1-800-GAMBLER, or visit <a href="https://www.ncpgambling.org" rel="noopener">ncpgambling.org</a>. Set deposit limits with your sportsbook, and take a break if betting stops being fun.</p></div>`;
